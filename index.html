<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shadows – Bathroom Remodel Planner</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#1f2933; --muted:#6b7280; --accent:#2f6f5e; --line:#d8dce1; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--accent); color:#fff; padding:12px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; flex:1; }
  header button, .btn { background:#fff; color:var(--accent); border:0; border-radius:6px; padding:6px 12px; cursor:pointer; font-weight:600; }
  .btn.dark { background:var(--accent); color:#fff; }
  .btn.small { padding:3px 8px; font-size:12px; }
  nav { display:flex; gap:4px; padding:12px 20px 0; flex-wrap:wrap; }
  nav button { border:1px solid var(--line); border-bottom:0; background:#e9ecef; padding:8px 16px; border-radius:8px 8px 0 0; cursor:pointer; font-weight:600; color:var(--muted); }
  nav button.active { background:var(--card); color:var(--ink); }
  nav .sep { flex:1; }
  main { background:var(--card); margin:0 20px 20px; border:1px solid var(--line); border-radius:0 8px 8px 8px; padding:16px; }
  .layout { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:16px; }
  @media (max-width:900px){ .layout{grid-template-columns:1fr;} }
  #plan { width:100%; background:#fafafa; border:1px solid var(--line); border-radius:6px; }
  #plan [data-el] { cursor:pointer; }
  #plan [data-el]:hover { stroke:#e11d48; stroke-width:.6; }
  #plan .sel { stroke:#e11d48; stroke-width:.9; stroke-dasharray:2 1; }
  .panel { border:1px solid var(--line); border-radius:6px; padding:12px; }
  .panel h3 { margin:0 0 8px; font-size:15px; }
  .elist { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .elist button { border:1px solid var(--line); background:#fff; border-radius:14px; padding:3px 10px; cursor:pointer; font-size:12px; display:flex; align-items:center; gap:6px; }
  .elist button.active { border-color:#e11d48; background:#fff1f3; }
  .dot { width:12px; height:12px; border-radius:50%; border:1px solid #0003; display:inline-block; }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 2px; }
  input[type=text], input[type=number], input[type=date], select, textarea { width:100%; padding:5px 7px; border:1px solid var(--line); border-radius:5px; font:inherit; background:#fff; }
  input[type=color] { width:100%; height:34px; padding:0; border:1px solid var(--line); border-radius:5px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .hint { color:var(--muted); font-size:12px; margin-top:8px; }
  .totals { display:flex; gap:12px; flex-wrap:wrap; margin:0 0 12px; }
  .total { background:var(--bg); border-radius:8px; padding:8px 14px; min-width:150px; }
  .total b { display:block; font-size:20px; }
  .total span { color:var(--muted); font-size:12px; }
  .tablewrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; min-width:1100px; }
  th, td { border-bottom:1px solid var(--line); padding:4px; text-align:left; vertical-align:middle; }
  th { font-size:12px; color:var(--muted); white-space:nowrap; }
  td input, td select { padding:4px 5px; font-size:13px; }
  td.num input { text-align:right; }
  .st-Planned { background:#e5e7eb; } .st-Ordered { background:#fde68a; } .st-Shipped { background:#bfdbfe; }
  .st-Delivered { background:#bbf7d0; } .st-Installed { background:#86efac; } .st-Returned { background:#fecaca; }
  .st-Cancelled { background:#fecaca; }
  .lt { text-decoration:line-through; opacity:.55; }
  .hidden { display:none; }
  .toolbar { display:flex; gap:6px; margin-bottom:8px; align-items:center; }
  .toolbar .sep { flex:1; }
  .toolbar .btn:not(.dark) { border:1px solid var(--line); }
  #v3d { width:100%; height:min(560px,52vh); position:sticky; top:0; z-index:5; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:#eef0f3; }
  #v3d canvas { display:block; }
</style>
</head>

  }
  s.seeded = s.seeded || [];
  if (!s.seeded.includes("upstairs-match-master")) {
    s.seeded.push("upstairs-match-master");
    const c = s.baths.upstairs.custom;
    for (const id of ["toilet", "vanity", "sink", "faucet", "showerhead", "drain"]) delete c[id];
  }
  if (!s.seeded.includes("walnut-fronts")) {
    s.seeded.push("walnut-fronts");
    const w = s.baths.master.custom && s.baths.master.custom.vanitywood;
    if (w) { delete w.color; delete w.product; }

  if (!s.seeded.includes("bn-migration")) {

    const m = s.baths.master;
    m.orders = m.orders.filter(o => !(o.id || "").includes("kohler-purist-t14413-master"));
    for (const id of ["faucet", "showerhead", "drain"]) if (m.custom && m.custom[id]) { delete m.custom[id].color; delete m.custom[id].product; }
  }
  if (!s.seeded.includes("prices-1")) {
    s.seeded.push("prices-1");
    const P = { "K-28161-0": 699.79, "K-T14413-3-BN": 736.35, "K-TS14422-4-BN": 818.10, "K-22178-BN": 596.62, "EB-EWA3621 / EB-TW3621MB": 615 };
    for (const k of ["upstairs", "master"]) {
      const b = s.baths[k];
      for (const o of b.orders) {
        if (+o.price) continue;
        const m = o.model || (String(o.item).match(/\(([^()]*)\)\s*$/) || [])[1];
        if (P[m] != null) o.price = P[m];
        if (o.id === "seed-tile-" + k) o.price = 31.74;

    s.seeded.push("faucet-nickel-color");
    const c = s.baths.master.custom && s.baths.master.custom.faucet;
    if (c) delete c.color;
  }
  for (const sd of SEED_ORDERS) {
    if (s.seeded.includes(sd.key)) continue;
    s.seeded.push(sd.key);
    s.baths[sd.bath].orders.push(Object.assign({ id: "seed-" + sd.key + "-" + sd.bath, qty: 1, status: "Planned", ordered: "", eta: "", delivered: "", ref: "" }, sd.order));
  }
  if (!s.seeded.includes("elemento-towel-warmer-brushed-nickel")) {
    s.seeded.push("elemento-towel-warmer-brushed-nickel");
    for (const bath of ["upstairs", "master"]) {
      const custom = s.baths[bath].custom.towelwarmer;
      if (custom) Object.assign(custom, { color:"#b4b0a6", product:BATHS[bath].elements.find(e => e.id === "towelwarmer").product });
      const order = s.baths[bath].orders.find(o => o.id === `seed-elemento-towel-warmer-${bath}-${bath}`);
      if (order) Object.assign(order, {
        item:"Elemento Bath wall-mounted vertical heated towel rack with digital display, Brushed Nickel (EB-TW3621BN)",
        model:"EB-TW3621BN",
        notes:"Brushed Nickel finish. SKU: EB-TW3621BN. Spec: 14 1/2 in wide x 35 3/8 in high x 3 1/4 in deep; two rods spaced 13 37/64 in center-to-center. Price per elementobath.com for a similar wall-mount model; confirm."
      });
    }
    localStorage.setItem(KEY, JSON.stringify(s));
  }
  return s;
}

/* Design view */
function tileDefs(bath) {
  return BATHS[bath].elements.filter(e => e.tile).map(base => {
    const e = el(bath, base.id), t = +e.tileSize || 2, g = Math.min(+e.grout_w || 0.25, t / 2);
    const inner = e.image
      ? `<image href="${e.image}" width="${t}" height="${t}" preserveAspectRatio="xMidYMid slice"/>
         <rect width="${t}" height="${t}" fill="none" stroke="${e.grout}" stroke-width="${g}"/>`
      : `<rect width="${t}" height="${t}" fill="${e.color}"/>
         <rect width="${t}" height="${t}" fill="none" stroke="${e.grout}" stroke-width="${g}"/>`;
    return `<pattern id="pat-${bath}-${e.id}" patternUnits="userSpaceOnUse" width="${t}" height="${t}">${inner}</pattern>`;
  }).join("");
}

function shapeSvg(bath, base) {
  const e = el(bath, base.id);
  const fill = e.tile ? `url(#pat-${bath}-${e.id})` : e.color;
  const cls = ui.sel[bath] === e.id ? "sel" : "";
  const a = `data-el="${e.id}" class="${cls}" fill="${fill}" stroke="#0004" stroke-width=".3"`;
  if (base.id === "towelwarmer" && e.mount?.controller) {
    const t = e.mount, c = t.controller;
    const cx = t.cx + t.ux * c.x - t.uz * c.z, cy = t.cy + t.uz * c.x + t.ux * c.z;
    const body = e.shape === "rect"
      ? `<rect ${a} x="${e.x}" y="${e.y}" width="${e.w}" height="${e.h}"/>`
      : `<path ${a} d="${e.d}"/>`;
    return `<g>${body}
      <circle data-el="${e.id}" class="${cls}" cx="${cx}" cy="${cy}" r="1.4" fill="#171717" stroke="#777" stroke-width=".3"><title>Separate digital controller</title></circle>
      <rect x="${cx - .35}" y="${cy - .75}" width=".7" height=".18" rx=".04" fill="#ddd" pointer-events="none"/>
      <circle cx="${cx - .45}" cy="${cy + .25}" r=".12" fill="#bbb" pointer-events="none"/>
      <circle cx="${cx}" cy="${cy + .25}" r=".12" fill="#bbb" pointer-events="none"/>
      <circle cx="${cx + .45}" cy="${cy + .25}" r=".12" fill="#bbb" pointer-events="none"/>
    </g>`;
  }
  if (e.shape === "rect") return `<rect ${a} x="${e.x}" y="${e.y}" width="${e.w}" height="${e.h}" rx="${e.rx||0}"/>`;
  if (e.shape === "ellipse") return `<ellipse ${a} cx="${e.cx}" cy="${e.cy}" rx="${e.rx}" ry="${e.ry}"/>`;
  return `<path ${a} d="${e.d}"/>`;
}

function dimSvg(d) {
  const mx = (d.x1 + d.x2) / 2, my = (d.y1 + d.y2) / 2;
  const txt = d.vertical
    ? `<text transform="translate(${mx - 1.5} ${my}) rotate(-90)" text-anchor="middle" font-size="4" fill="#555">${d.text}</text>`
    : `<text x="${mx}" y="${my - 1.5}" text-anchor="middle" font-size="4" fill="#555">${d.text}</text>`;
  return `<line x1="${d.x1}" y1="${d.y1}" x2="${d.x2}" y2="${d.y2}" stroke="#888" stroke-width=".3"/>${txt}`;
}

function planSvg(bath) {
  const b = BATHS[bath];
  const rooms = b.elements.filter(e => e.shape !== "none").map(e => shapeSvg(bath, e)).join("");
  // Floors are drawn first so the fixtures (listed later) sit on top; walls go above floors.
  return `<svg id="plan" viewBox="${b.view.join(" ")}" xmlns="http://www.w3.org/2000/svg">
    <defs>${tileDefs(bath)}</defs>
    <path d="${b.outline}" fill="none" stroke="#3b3b3b" stroke-width="8" stroke-linejoin="miter"/>
    ${rooms}
    ${b.walls.map(w => `<rect x="${w.x}" y="${w.y}" width="${w.w}" height="${w.h}" fill="#3b3b3b"/>`).join("")}
    ${b.openings.map(o => `<rect x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" fill="${o.color}" stroke="#777" stroke-width=".3"><title>${o.label}</title></rect>`).join("")}
    ${b.dims.map(dimSvg).join("")}
  </svg>`;
}

  if (ui.mode === "3d") View3D.setOff(state.baths[bath].calc.off), View3D.mount($("#v3d"), bath, ui.sel[bath], id => { ui.sel[bath] = id; renderDesign(); });

/* Tile square footage calculator */
function surfArea(sf) {
  if (sf.poly) {
    const p = sf.poly; let a = 0;
    p.forEach((q, i) => { const n = p[(i + 1) % p.length]; a += q[0] * n[1] - n[0] * q[1]; });
    return { gross: Math.abs(a) / 2 / 144, cut: 0 };
  }
  return { gross: sf.len * sf.h / 144, cut: (sf.cut || []).reduce((x, c) => x + c[1] * c[2], 0) / 144 };
}
function calcTotals(bath) {
  const c = state.baths[bath].calc, g = {};
  let net = 0;
  BATHS[bath].surfaces.forEach(sf => {
    if (c.off[sf.id]) return;
    const a = surfArea(sf), n = a.gross - a.cut;
    g[sf.group] = (g[sf.group] || 0) + n; net += n;
  });
  const need = net * (1 + (+c.waste || 0) / 100);
  const sheets = Math.ceil(need / (+c.sheetSqft || 1) - 1e-9);
  return { g, net, need, sheets, cost: sheets * (+c.sheetPrice || 0) };
}
const sq = n => n.toFixed(1);
function calcHtml(bath) {
  const c = state.baths[bath].calc, t = calcTotals(bath);
  const rows = BATHS[bath].surfaces.map(sf => {
    const a = surfArea(sf), off = !!c.off[sf.id];
    const size = sf.poly ? "" : `${sf.len}" x ${sf.h}"` + (sf.cut ? sf.cut.map(x => ` &minus; ${x[0]} ${x[1]}x${x[2]}`).join("") : "");
    return `<tr class="${off ? "lt" : ""}"><td style="width:30px"><input type="checkbox" data-calc-off="${sf.id}" ${off ? "" : "checked"}></td><td>${sf.label}</td><td style="color:var(--muted)">${size}</td><td style="text-align:right">${sq(a.gross - a.cut)}</td></tr>`;
  }).join("");
  const grp = Object.keys(t.g).map(k => `${k}: <b>${sq(t.g[k])}</b>`).join(" &nbsp;|&nbsp; ");
  return `<div class="panel" style="margin-top:14px"><h3 style="margin-top:0">Tile square footage</h3>
    <table style="min-width:0"><thead><tr><th style="width:30px"></th><th>Surface</th><th>Size</th><th style="text-align:right">Sq ft</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="hint">Untick a surface (exterior wall, pocket door wall, etc.) to remove it from the total. Wall height is 8'; openings are subtracted.</div>
    <div class="totals" style="margin-top:10px">
      <div class="total"><b>${sq(t.net)} sq ft</b><span>Net tile area</span></div>
      <div class="total"><b>${sq(t.need)} sq ft</b><span>With ${+c.waste || 0}% waste</span></div>
      <div class="total"><b>${t.sheets}</b><span>Sheets to buy</span></div>
      <div class="total"><b>${money(t.cost)}</b><span>Estimated cost</span></div>
    </div>
    <div class="hint">${grp}</div>
    <div class="row2" style="margin-top:8px">
      <div><label>Waste %</label><input type="number" min="0" step="1" data-calc="waste" value="${c.waste}"></div>
      <div><label>Sq ft per sheet</label><input type="number" min="0.1" step="0.01" data-calc="sheetSqft" value="${c.sheetSqft}"></div>
    </div>
    <div class="row2"><div><label>Price per sheet ($)</label><input type="number" min="0" step="0.01" data-calc="sheetPrice" value="${c.sheetPrice}"></div>
      <div><label>&nbsp;</label><button class="btn small" id="calcToOrders">Add tile to Orders</button></div></div>
  </div>`;
}
(function seedTiles() {
  const tiles = { upstairs: ["Daltile Keystones Nautical Blue mosaic, matte, 1x1", "D621"], master: ["Daltile Keystones Brownberry mosaic, matte, 1x1", "D118STJ11MT"] };
  let dirty = false;
  for (const k in tiles) {

    const c = state.baths[k].calc; c.sheetSqft = 2; c.sheetPrice = 31.74;
    const tt = calcTotals(k);
    state.baths[k].orders.unshift({ id: "seed-tile-" + k, item: tiles[k][0] + " (" + tiles[k][1] + ")", vendor: "Daltile", model: tiles[k][1], qty: tt.sheets, price: 31.74, status: "Planned", ordered: "", eta: "", delivered: "", ref: "", notes: "Quantity from the tile calculator (sheets, " + c.waste + "% waste). Sheet = 12x24 in (2 sq ft). $31.74/sheet from ~$15.87/sq ft online; Brownberry price assumed same - confirm." });
  }
  if (!state.seeded.includes("tile-qty-1")) {
    state.seeded.push("tile-qty-1"); dirty = true;
    for (const k in tiles) {
      const o = state.baths[k].orders.find(x => x.id === "seed-tile-" + k);
      if (o) o.qty = calcTotals(k).sheets;

  }
  if (dirty) save();
})();

/* Orders view */
const lineTotal = o => (+o.qty || 0) * (+o.price || 0);
const counted = o => o.status !== "Cancelled" && o.status !== "Returned";

function bathTotals(bath) {
  const orders = state.baths[bath].orders.filter(counted);
  const sum = f => orders.filter(f).reduce((a, o) => a + lineTotal(o), 0);
  return {
    total: sum(() => true),
    committed: sum(o => o.status !== "Planned"),
    delivered: sum(o => o.status === "Delivered" || o.status === "Installed"),
    planned: sum(o => o.status === "Planned"),
  };
}

function totalsHtml(bath) {
  const t = bathTotals(bath);
  return `<div class="totals">
    <div class="total"><b>${money(t.total)}</b><span>Total (excl. construction)</span></div>
    <div class="total"><b>${money(t.committed)}</b><span>Ordered or later</span></div>
    <div class="total"><b>${money(t.delivered)}</b><span>Delivered / installed</span></div>
    <div class="total"><b>${money(t.planned)}</b><span>Planned, not yet ordered</span></div>

}

function modelOf(o) {

  $("#main").innerHTML = `<h3 style="margin-top:0">Summary (excluding construction costs)</h3>
    <div class="tablewrap"><table style="min-width:600px">
      <thead><tr><th>Bathroom</th><th>Items</th><th>Total</th><th>Ordered or later</th><th>Delivered/installed</th><th>Planned</th></tr></thead>
      <tbody>${rows.join("")}<tr style="font-weight:700"><td>Both bathrooms</td><td>${Object.keys(BATHS).reduce((a,k)=>a+state.baths[k].orders.length,0)}</td><td>${s("total")}</td><td>${s("committed")}</td><td>${s("delivered")}</td><td>${s("planned")}</td></tr></tbody>
    </table></div>
    <div class="hint">Cancelled and returned items are excluded from totals.</div>
    ${Object.keys(BATHS).map(k => {
      const os = state.baths[k].orders;
      return `<h3>${BATHS[k].name} - all items</h3><div class="tablewrap"><table style="min-width:800px">
        <thead><tr><th>#</th><th>Item</th><th>Manufacturer</th><th>Model # / name</th><th class="num">Qty</th><th class="num">Unit price</th><th class="num">Line total</th><th>Status</th></tr></thead>
        <tbody>${os.map((o, i) => `<tr class="${counted(o) ? "" : "lt"}"><td>${i + 1}</td><td>${esc(o.item)}</td><td>${esc(o.vendor)}</td><td>${esc(modelOf(o))}</td><td class="num">${esc(o.qty)}</td><td class="num">${money(+o.price || 0)}</td><td class="num">${money(lineTotal(o))}</td><td>${esc(o.status)}</td></tr>`).join("") || `<tr><td colspan="8" style="color:var(--muted)">No items yet.</td></tr>`}
        <tr style="font-weight:700"><td></td><td colspan="5">Total (excl. construction)</td><td class="num">${money(bathTotals(k).total)}</td><td></td></tr></tbody>
      </table></div>`;
    }).join("")}`;
}

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-mode],[data-cam],[data-tab],[data-view],[data-pick],[data-el],[data-del],#addOrder,#calcToOrders,#csvBtn,#fReset,#fImgClear");
  if (!t) return;
  if (t.dataset.mode) { ui.mode = t.dataset.mode; return renderDesign(); }
  if (t.dataset.cam) return View3D.preset(t.dataset.cam);
  if (t.dataset.tab) { ui.tab = t.dataset.tab; return render(); }
  if (t.dataset.view) { ui.view = t.dataset.view; return render(); }
  if (t.dataset.pick || (t.dataset.el && t.closest("#plan"))) { ui.sel[ui.tab] = t.dataset.pick || t.dataset.el; return renderDesign(); }
  if (t.dataset.del) {
    const arr = state.baths[ui.tab].orders;
    arr.splice(arr.findIndex(o => o.id === t.dataset.del), 1);
    save(); return renderOrders();
  }
  if (t.id === "addOrder") {
    state.baths[ui.tab].orders.push({ id:uid(), item:"", vendor:"", qty:1, price:0, status:"Planned", ordered:"", eta:"", delivered:"", ref:"", notes:"" });
    save(); return renderOrders();
  }
  if (t.id === "calcToOrders") {
    const c = state.baths[ui.tab].calc, tt = calcTotals(ui.tab);
    const tile = el(ui.tab, "floor").product || "Tile";
    state.baths[ui.tab].orders.push({ id:uid(), item:`${tile} (${sq(tt.need)} sq ft incl. ${c.waste}% waste)`, vendor:"Daltile", qty:tt.sheets, price:+c.sheetPrice || 0, status:"Planned", ordered:"", eta:"", delivered:"", ref:"", notes:"Quantity from the tile calculator." });
    save(); ui.view = "orders"; return render();
  }
  if (t.id === "csvBtn") return downloadCsv();
  if (t.id === "fReset") { delete state.baths[ui.tab].custom[ui.sel[ui.tab]]; save(); return renderDesign(); }
  if (t.id === "fImgClear") { updateCustom({ image:"" }); return renderDesign(); }
});

document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.calc) {
    state.baths[ui.tab].calc[t.dataset.calc] = t.value === "" ? 0 : +t.value;
    save();
    const t2 = calcTotals(ui.tab), n = $("#tilecalc");
    const bs = n.querySelectorAll(".totals .total b");
    [sq(t2.net) + " sq ft", sq(t2.need) + " sq ft", t2.sheets, money(t2.cost)].forEach((v, i) => bs[i].textContent = v);
    n.querySelectorAll(".totals .total span")[1].textContent = `With ${+state.baths[ui.tab].calc.waste || 0}% waste`;
    return;
  }
  if (ui.view === "design" && ui.tab !== "summary") {
    const map = { fColor:["color"], fProduct:["product"], fGrout:["grout"], fTile:["tileSize", Number], fGW:["grout_w", Number] };
    if (map[t.id]) {
      updateCustom({ [map[t.id][0]]: map[t.id][1] ? map[t.id][1](t.value) : t.value });
      const focusId = t.id, pos = t.selectionStart;
      renderDesign();
      const n = document.getElementById(focusId);
      if (n && n.type !== "color") { n.focus(); try { n.setSelectionRange(pos, pos); } catch (_) {} }
      return;
    }
  }
  const tr = t.closest("tr[data-id]");
  if (tr && t.dataset.f) {
    const o = state.baths[ui.tab].orders.find(o => o.id === tr.dataset.id);
    o[t.dataset.f] = t.value;
    if (t.dataset.f === "status") {
      const today = new Date().toISOString().slice(0, 10);
      if (t.value === "Ordered" && !o.ordered) o.ordered = today;
      if ((t.value === "Delivered" || t.value === "Installed") && !o.delivered) o.delivered = today;
      save();
      return renderOrders();
    }
    save();
    tr.querySelector("[data-line]").textContent = money(lineTotal(o));
    $("#totals").innerHTML = totalsHtml(ui.tab);
  }
});

document.addEventListener("change", e => {
  if (e.target.dataset.calcOff) {
    const off = state.baths[ui.tab].calc.off, id = e.target.dataset.calcOff;
    if (e.target.checked) delete off[id]; else off[id] = true;
    save(); View3D.setOff(off); return refreshCalc();
  }
  if (e.target.id === "fImg" && e.target.files[0]) {
    const img = new Image(), url = URL.createObjectURL(e.target.files[0]);
    img.onload = () => {
      // Downscale so localStorage stays small.
      const c = document.createElement("canvas"), s = Math.min(1, 256 / Math.max(img.width, img.height));
      c.width = img.width * s; c.height = img.height * s;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      updateCustom({ image:c.toDataURL("image/jpeg", .85) });
      URL.revokeObjectURL(url); renderDesign();
    };
    img.src = url;
  }
});

function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function downloadCsv() {
  const cols = ["item","vendor","model","qty","price","status","ordered","eta","delivered","ref","notes"];
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [[...cols, "line_total"].join(",")].concat(state.baths[ui.tab].orders.map(o => [...cols.map(c => q(c === "model" ? modelOf(o) : o[c])), lineTotal(o)].join(",")));
  download(`${ui.tab}-orders.csv`, lines.join("\n"), "text/csv");
}
$("#exportBtn").onclick = () => download("shadows-bathroom-backup.json", JSON.stringify(state, null, 2), "application/json");
$("#importBtn").onclick = () => $("#importFile").click();
$("#importFile").onchange = async e => {
  try { state = Object.assign(load(), JSON.parse(await e.target.files[0].text())); save(); render(); }
  catch (err) { alert("Could not read that file."); }
};

render();
</script>
</body>
</html>
